[meson setup <builddir> --cross-file=macos-arm-toolchain.ini  -Denable_tests=true]

[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'  # ou 'x86_64' pour Intel
cpu = 'aarch64'
endian = 'little'